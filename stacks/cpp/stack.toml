[stack]
name = "cpp"
status = "skeleton"        # UNTESTED as a harness stack (the benchmark scripts compile C++ with g++/clang/MSVC)

[gates]
fast = ["cmake --build build", "ctest --test-dir build --output-on-failure"]
full = ["cmake -S . -B build", "cmake --build build", "ctest --test-dir build --output-on-failure"]

[timing]
worker_minutes = 12
gate_minutes = 8
gate_floor_minutes = 1
gate_ceiling_minutes = 30

[verify]
visual = "none"
compiler = ""              # g++ | clang++ | msvc (detected at /kickoff)
